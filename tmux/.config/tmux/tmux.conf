# Prefix remapping from the standard Ctrl-b
set -g prefix C-a
unbind C-b

# For toggling config reload.
unbind r
bind r source-file ~/.config/tmux/tmux.conf

set-option -g status-position top
set-option -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reorder window positions
bind -n S-Left swap-window -t -1\; select-window -t -1
bind -n S-Right swap-window -t +1\; select-window -t +1

bind x kill-pane

unbind c
bind n new-window -c "#{pane_current_path}"

set -g mouse on
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
set -g repeat-time 1000

# Start window numbers from 1 instead of the standard 0
set -g base-index 1
set -g renumber-windows

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
