"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 4
final_space = true

[palette]
  background = "#24283b"
  foreground = "#c0caf5"
  black = "#1d202f"
  red = "#f7768e"
  green = "#9ece6a"
  yellow = "#e0af68"
  blue = "#7aa2f7"
  magenta = "#bb9af7"
  cyan = "#7dcfff"
  white = "#a9b1d6"

[transient_prompt]
  template = "❯ "
  background = "transparent"
  foreground = "p:magenta"

[[blocks]]
  type = "prompt"
  alignment = "left"
  newline = true

  [[blocks.segments]]
    type = "path"
    style = "plain"
    foreground = "p:cyan"
    template = "{{ .Path }} "

    [blocks.segments.options]
      style = "full"

  [[blocks.segments]]
    type = "git"
    style = "plain"
    foreground = "p:yellow"
    template = "{{ .UpstreamIcon }}{{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }} "

    [blocks.segments.options]
      fetch_status = true
      fetch_upstream_icon = true
      branch_icon = " "

[[blocks]]
  type = "prompt"
  alignment = "left"

  [[blocks.segments]]
    type = "text"
    style = "plain"
    foreground = "p:blue"
    template = "❯ "
